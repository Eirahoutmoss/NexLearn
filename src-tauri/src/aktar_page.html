<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NexAktar</title>
<style>
:root{--bg:#f7f5f0;--fg:#1f1d1a;--muted:#5d5850;--card:#fff;--line:#d9d3c7;--accent:#b4541b;--ok:#1d7348;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#171513;--fg:#f1ede6;--muted:#b7afa3;--card:#211e1b;--line:#3a352f;--accent:#f0a46d;--ok:#6fd19c;--bad:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
h2{font-size:1.1rem;margin:0 0 8px}
p{margin:0 0 12px}
.muted{color:var(--muted);font-size:.95rem}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-weight:650;margin:8px 0;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#1a1410}}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
textarea{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;padding:10px}
ul{list-style:none;margin:0;padding:0}
li{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
li:first-child{border-top:0}
.name{flex:1 1 60%;word-break:break-word}
.state{font-size:.9rem;color:var(--muted)}
.state.ok{color:var(--ok)}.state.bad{color:var(--bad)}
progress{width:100%;height:8px}
.status{font-size:.9rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>NexAktar</h1>
  <p class="muted" id="intro"></p>
  <p class="status" id="status" role="status" aria-live="polite"></p>

  <section aria-labelledby="send-h">
    <h2 id="send-h"></h2>
    <label class="btn primary" for="files" id="pick-label"></label>
    <input id="files" type="file" multiple>
    <label class="btn" for="camera" id="cam-label"></label>
    <input id="camera" type="file" accept="image/*" capture="environment">
    <ul id="queue" aria-live="polite"></ul>
  </section>

  <section aria-labelledby="text-h">
    <h2 id="text-h"></h2>
    <label for="text" class="muted" id="text-label"></label>
    <textarea id="text"></textarea>
    <button class="btn" id="send-text" type="button"></button>
  </section>

  <section aria-labelledby="get-h">
    <h2 id="get-h"></h2>
    <p class="muted" id="get-empty"></p>
    <ul id="outgoing"></ul>
  </section>

  <p class="muted" id="privacy"></p>
</main>
<script>
(function(){
  "use strict";
  var tr = {
    intro:"Bu sayfa bilgisayarındaki NexLearn’e aynı Wi-Fi üzerinden dosya gönderir. Dosyalar internete çıkmaz.",
    send:"Bilgisayara gönder", pick:"Dosya seç", cam:"Fotoğraf çek (sayfa tara)",
    text:"Metin gönder", textLabel:"Not ya da kopyaladığın bir metin", sendText:"Metni gönder",
    get:"Bilgisayardan al", getEmpty:"Bilgisayarda “Telefona gönder” ile seçilen dosyalar burada görünür.",
    privacy:"Bilgisayarda her dosyayı ayrıca onaylaman gerekir. Bağlantı en geç 10 dakika sonra kapanır.",
    waiting:"Sırada", sending:"Gönderiliyor", sent:"Gönderildi — bilgisayarda onayla", failed:"Gönderilemedi",
    tooLarge:"Dosya çok büyük", expired:"Bağlantı kapandı. Bilgisayarda yeniden QR kod oluştur.",
    remaining:function(m){return "Bağlantı açık · yaklaşık "+m+" dk kaldı"}, download:"İndir", textEmpty:"Önce bir metin yaz."
  };
  var en = {
    intro:"This page sends files to NexLearn on your computer over the same Wi-Fi. Files never leave your network.",
    send:"Send to computer", pick:"Choose files", cam:"Take a photo (scan a page)",
    text:"Send text", textLabel:"A note or some text you copied", sendText:"Send text",
    get:"Get from computer", getEmpty:"Files chosen with “Send to phone” on the computer appear here.",
    privacy:"You confirm each file on the computer. The link closes after 10 minutes at most.",
    waiting:"Queued", sending:"Sending", sent:"Sent — confirm on the computer", failed:"Could not send",
    tooLarge:"File is too large", expired:"Connection closed. Create a new QR code on the computer.",
    remaining:function(m){return "Connected · about "+m+" min left"}, download:"Download", textEmpty:"Write some text first."
  };
  var L = /^tr\b/i.test(navigator.language || "") ? tr : en;
  document.documentElement.lang = L === tr ? "tr" : "en";
  var token = new URLSearchParams(location.search).get("t") || "";
  var q = "?t=" + encodeURIComponent(token);
  function $(id){return document.getElementById(id)}
  function set(id, txt){$(id).textContent = txt}
  set("intro",L.intro);set("send-h",L.send);set("pick-label",L.pick);set("cam-label",L.cam);
  set("text-h",L.text);set("text-label",L.textLabel);set("send-text",L.sendText);
  set("get-h",L.get);set("get-empty",L.getEmpty);set("privacy",L.privacy);
  var closed = false;

  function row(name){
    var li=document.createElement("li");
    var n=document.createElement("span");n.className="name";n.textContent=name;
    var s=document.createElement("span");s.className="state";s.textContent=L.waiting;
    var p=document.createElement("progress");p.max=100;p.value=0;p.hidden=true;
    li.appendChild(n);li.appendChild(s);li.appendChild(p);$("queue").appendChild(li);
    return {state:s,bar:p};
  }
  var chain = Promise.resolve();
  function upload(blob, name, path){
    var r=row(name);
    chain = chain.then(function(){
      return new Promise(function(done){
        if(closed){r.state.textContent=L.expired;r.state.className="state bad";return done();}
        var x=new XMLHttpRequest();
        x.open("POST", path + q);
        x.setRequestHeader("X-Name", encodeURIComponent(name));
        x.setRequestHeader("Content-Type","application/octet-stream");
        r.state.textContent=L.sending;r.bar.hidden=false;
        x.upload.onprogress=function(e){if(e.lengthComputable)r.bar.value=Math.round(e.loaded/e.total*100)};
        x.onload=function(){
          r.bar.hidden=true;
          if(x.status===200){r.state.textContent=L.sent;r.state.className="state ok"}
          else{r.state.textContent=x.status===413?L.tooLarge:(x.status===403?L.expired:L.failed);r.state.className="state bad"}
          done();
        };
        x.onerror=function(){r.bar.hidden=true;r.state.textContent=L.failed;r.state.className="state bad";done()};
        x.send(blob);
      });
    });
  }
  function onPick(e){
    var fs=e.target.files||[];
    for(var i=0;i<fs.length;i++){
      var f=fs[i];
      var name=f.name||("foto-"+Date.now()+".jpg");
      upload(f,name,"/u");
    }
    e.target.value="";
  }
  $("files").addEventListener("change",onPick);
  $("camera").addEventListener("change",onPick);
  $("send-text").addEventListener("click",function(){
    var t=$("text").value;
    if(!t.trim()){set("status",L.textEmpty);return}
    var first=t.trim().split(/\n/)[0].slice(0,40);
    upload(new Blob([t],{type:"text/plain;charset=utf-8"}),first+".txt","/text");
    $("text").value="";
  });

  function refresh(){
    if(closed)return;
    fetch("/ping"+q,{cache:"no-store"}).then(function(r){
      if(!r.ok)throw 0;return r.json();
    }).then(function(j){
      set("status",L.remaining(Math.max(1,Math.ceil(j.remaining/60))));
      return fetch("/o"+q,{cache:"no-store"}).then(function(r){return r.json()});
    }).then(function(list){
      var ul=$("outgoing");ul.textContent="";
      $("get-empty").hidden=list.length>0;
      list.forEach(function(it){
        var li=document.createElement("li");
        var n=document.createElement("span");n.className="name";n.textContent=it.name;
        var a=document.createElement("a");a.className="btn";a.textContent=L.download;
        a.href="/o/"+encodeURIComponent(it.id)+q;a.setAttribute("download",it.name);
        li.appendChild(n);li.appendChild(a);ul.appendChild(li);
      });
    }).catch(function(){closed=true;set("status",L.expired)});
  }
  refresh();
  setInterval(refresh,15000);
})();
</script>
</body>
</html>
