[package]
name = "nexlearn"
version = "0.1.0"
description = "NexLearn — ücretsiz, yerel öncelikli öğrenme uygulaması"
authors = ["Hasan Güler"]
license = "MPL-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "nexlearn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
