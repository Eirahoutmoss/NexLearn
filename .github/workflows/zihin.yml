name: Zihin paketi

# Zihin (isteğe bağlı yerel yapay zekâ) paketini "zihin-v1" ön sürümü olarak yayımlar.
# Model Hugging Face'teki açık lisanslı kaynaktan indirilir, beklenen SHA-256 ile doğrulanır,
# manifest üretilir ve sürüme eklenir. Uygulama sürümlerinden bağımsızdır (güncelleme denetimi bu etiketi yok sayar).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/zihin.yml
      - scripts/make-zihin-manifest.mjs

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Modelleri indir ve manifest üret
        run: |
          set -e
          HF=https://huggingface.co
          dl() { curl -fL --retry 3 -o "$RUNNER_TEMP/$2" "$HF/$1/resolve/main/$2"; }
          # Hafif — kullanıcının doğruladığı dosyayla aynı özet zorunlu
          dl unsloth/Qwen3-0.6B-GGUF Qwen3-0.6B-Q4_K_M.gguf
          echo "ac2d97712095a558e31573f62f466a3f9d93990898b0ec79d7c974c1780d524a  $RUNNER_TEMP/Qwen3-0.6B-Q4_K_M.gguf" | sha256sum -c -
          ARGS=("$RUNNER_TEMP/Qwen3-0.6B-Q4_K_M.gguf" --id qwen3-0-6b --label "Qwen3 0.6B" --license Apache-2.0 --langs tr,en --ctx 4096 --tier light --ram 2)
          # Dengeli ve güçlü — indirilebilirse eklenir (2 GB altı tek dosya)
          if dl unsloth/Qwen3-1.7B-GGUF Qwen3-1.7B-Q4_K_M.gguf; then
            ARGS+=("$RUNNER_TEMP/Qwen3-1.7B-Q4_K_M.gguf" --id qwen3-1-7b --label "Qwen3 1.7B" --license Apache-2.0 --langs tr,en --ctx 4096 --tier balanced --ram 4)
          else echo "::warning::Qwen3 1.7B indirilemedi"; fi
          if dl unsloth/Qwen3-4B-GGUF Qwen3-4B-Q3_K_S.gguf && [ "$(stat -c%s "$RUNNER_TEMP/Qwen3-4B-Q3_K_S.gguf")" -lt 2000000000 ]; then
            ARGS+=("$RUNNER_TEMP/Qwen3-4B-Q3_K_S.gguf" --id qwen3-4b --label "Qwen3 4B" --license Apache-2.0 --langs tr,en --ctx 4096 --tier strong --ram 8)
          else echo "::warning::Qwen3 4B eklenmedi (indirilemedi ya da 2 GB üstü)"; rm -f "$RUNNER_TEMP/Qwen3-4B-Q3_K_S.gguf"; fi
          node scripts/make-zihin-manifest.mjs "${ARGS[@]}"
          cp "$RUNNER_TEMP"/*.gguf dist-zihin/
          ls -la dist-zihin
          cat dist-zihin/zihin-manifest.json
      - name: Ön sürüm (zihin-v1)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zihin-v1
          target_commitish: ${{ github.sha }}
          name: Zihin paketi v1
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            NexLearn **Zihin** — isteğe bağlı, tamamen cihazda çalışan yerel yapay zekâ paketi.
            Uygulamada: Ayarlar → Zihin → **Zihin'i etkinleştir**. Dosyalar SHA-256 ile doğrulanır.
            Modeller (hepsi Apache-2.0): Qwen3 0.6B (hafif), Qwen3 1.7B (dengeli), Qwen3 4B (güçlü). Uygulama cihaza göre birini önerir.
          files: dist-zihin/*
