name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — tip, lint, test, build, e2e, erişilebilirlik
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bağımlılık denetimi (üretim)
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - name: Birim ve entegrasyon testleri
        run: npm test
      - run: npm run build
      - name: Playwright tarayıcısı ve qpdf
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y qpdf
      - name: Uçtan uca + erişilebilirlik (axe) + çevrimdışı testleri
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  desktop-rust:
    name: Masaüstü — Rust testleri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Ön yüz derlemesi (tauri generate_context için dist gerekir)
        run: |
          npm ci
          TAURI_ENV_PLATFORM=linux npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  desktop-windows:
    name: Masaüstü — Windows paketi (yalnızca main)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Tauri derlemesi (NSIS + MSI)
        run: npm run tauri build
      - name: Kurulum dosyaları ve SHA256SUMS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/msi/*.msi | Copy-Item -Destination out
          Get-ChildItem out | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -Encoding ascii out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nexlearn-windows-${{ github.sha }}
          path: out/*
          retention-days: 14

  android:
    name: Android — birim testleri ve APK (yalnızca main)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Web derlemesi ve Capacitor eşitlemesi
        run: npm run android:sync
      - name: İmza anahtarı (gizli değişken tanımlıysa)
        env:
          KS: ${{ secrets.NEXLEARN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/nexlearn.jks"
            echo "NEXLEARN_KEYSTORE_PATH=$RUNNER_TEMP/nexlearn.jks" >> "$GITHUB_ENV"
          fi
      - name: Gradle — testler ve APK
        working-directory: android
        env:
          NEXLEARN_KEYSTORE_PASSWORD: ${{ secrets.NEXLEARN_KEYSTORE_PASSWORD }}
          NEXLEARN_KEY_ALIAS: ${{ secrets.NEXLEARN_KEY_ALIAS }}
          NEXLEARN_KEY_PASSWORD: ${{ secrets.NEXLEARN_KEY_PASSWORD }}
        run: |
          if [ -n "$NEXLEARN_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          else
            echo "::warning::İmza anahtarı tanımlı değil; deneme amaçlı debug APK üretiliyor."
            ./gradlew --no-daemon testDebugUnitTest assembleDebug
          fi
      - name: APK ve SHA256SUMS
        run: |
          mkdir -p out
          V=$(node -p "require('./package.json').version")
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/NexLearn_${V}_android.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "out/NexLearn_${V}_android-debug.apk"
          fi
          (cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: nexlearn-android-${{ github.sha }}
          path: out/*
          retention-days: 14
