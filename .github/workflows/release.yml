name: Release (Windows)

# Sürüm etiketi (ör. v0.2.0) gönderildiğinde Windows kurulum dosyaları üretilir,
# SHA256SUMS.txt hesaplanır ve GitHub sürümüne eklenir. Uygulama içi "Güncellemeleri denetle"
# düğmesi bu sürümü bulur ve kurulum dosyasını SHA-256 ile doğrulayarak kurar.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Etiket ve package.json sürümü eşleşmeli
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($pkg -ne $tag) { Write-Error "package.json ($pkg) ile etiket ($tag) uyuşmuyor"; exit 1 }
      - run: npm test
      - name: Tauri derlemesi
        run: npm run tauri build
      - name: Kurulum dosyalarını topla ve SHA256SUMS üret
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/msi/*.msi | Copy-Item -Destination out
          $lines = Get-ChildItem out | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $lines | Set-Content -Encoding ascii out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nexlearn-windows
          path: out/*
      - name: GitHub sürümü
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
